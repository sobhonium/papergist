name: Update Papers

on:
  schedule:
    # Every 4 hours. GitHub only guarantees best-effort timing for scheduled
    # jobs (they can be delayed during high load on the GitHub infrastructure).
    - cron: "0 */4 * * *"
  workflow_dispatch: # allow manual trigger from the Actions tab

# Only one run at a time; cancel in-progress if a new one starts (avoids
# concurrent commits to the same data.json).
concurrency:
  group: update-papers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch new papers and build gists
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Fetch the 100 latest papers, then build learning notes + citation
        # counts for up to 10 NEW papers (skipping ids already in data.json).
        # Skips ids already present, so re-runs never duplicate work.
        run: |
          python pipeline.py --fetch 100 --new 10 --groq-key "$GROQ_API_KEY"

      - name: Commit changes if data.json was updated
        # Only create a commit when the pipeline actually wrote new papers.
        # If nothing changed, git sees no diff and we exit cleanly.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the generated data file (ignore source/tooling).
          git add site/data.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update paper gists ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Pushed updated data.json"
          else
            echo "No new papers — data.json unchanged, nothing to commit."
          fi

      - name: Notify Slack
        if: steps.git.outputs.updated == 'true'
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "Paper gist just updated."
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
